
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Add Product</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f3f6fa; margin: 0; }
        nav { background: #172554; padding: 18px; }
        nav a { color: white; margin-right: 20px; text-decoration: none; }
        main { max-width: 600px; margin: 30px auto; padding: 24px; background: white; border-radius: 10px; }
        label { display: block; margin-top: 15px; }
        input { box-sizing: border-box; width: 100%; padding: 11px; margin-top: 6px; }
        button { margin-top: 20px; background: #1d4ed8; color: white; border: 0; padding: 12px 18px; cursor: pointer; border-radius: 5px; }
        .message { background: #fee2e2; padding: 10px; }
    </style>
</head>
<body>
<nav>
    <a href="/">Dashboard</a>
    <a href="/products">Products</a>
    <a href="/add">Add Product</a>
</nav>
<main>
    <h1>Add New Product</h1>

    {% with messages = get_flashed_messages() %}
        {% for message in messages %}
            <p class="message">{{ message }}</p>
        {% endfor %}
    {% endwith %}

    <form method="POST">
        <label for="name">Product Name</label>
        <input id="name" name="name" required maxlength="100">

        <label for="category">Category</label>
        <input id="category" name="category" required maxlength="100">

        <label for="quantity">Quantity</label>
        <input id="quantity" name="quantity" type="number" min="0" required>

        <label for="price">Price (₹)</label>
        <input id="price" name="price" type="number" min="0" step="0.01" required>

        <label for="min_stock">Minimum Stock Alert Level</label>
        <input id="min_stock" name="min_stock" type="number" min="0" value="5" required>

        <button type="submit">Save Product</button>
    </form>
</main>
</body>
</html>
